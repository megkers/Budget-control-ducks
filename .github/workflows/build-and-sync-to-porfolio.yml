name: Build and Sync to Portfolio
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout budget-control
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout my-portfolio
        uses: actions/checkout@v6
        with:
          repository: megkers/my-portfolio
          token: ${{ secrets.PORTFOLIO_PAT }}
          path: my-portfolio

      # The app is served at /budget-control/. It used to be /budget-controller/;
      # removing that folder too makes the PR a move rather than a second copy.
      # my-portfolio's .htaccess redirects the old address.
      - name: Copy build output into portfolio.
        run: |
          rm -rf my-portfolio/budget-controller
          rm -rf my-portfolio/budget-control
          mkdir -p my-portfolio/budget-control
          cp -r ./dist/* my-portfolio/budget-control/

      - name: Open pull request on my-portfolio
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PORTFOLIO_PAT }}
          path: my-portfolio
          commit-message: "Update budget-control build"
          # Branch keeps its old name so runs keep updating the same open PR.
          branch: budget-controller-update
          title: "Update budget-control from latest build"
          body: "Automated update from Budget-control-ducks main branch."
